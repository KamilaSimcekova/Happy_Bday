<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Emmičko, všechno nejlepší k 17. narozeninám!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #2a1150 0%, #0d051f 70%, #000 100%);
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #fff;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Hvězdná noc v pozadí */
  .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* Start overlay */
  .start-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #2a1150 0%, #0d051f 70%, #000 100%);
    z-index: 9999;
    cursor: pointer;
    transition: opacity 0.8s ease;
  }
  .start-overlay h1 {
    font-size: clamp(1.5rem, 6vw, 3rem);
    background: linear-gradient(45deg, #ff6ec4, #ffd93d, #ff6ec4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    padding: 0 20px;
    margin-bottom: 30px;
    animation: pulse 2s infinite;
    font-weight: 800;
  }
  .start-overlay p {
    font-size: clamp(1rem, 3.5vw, 1.3rem);
    opacity: 0.9;
    padding: 15px 30px;
    border: 2px solid rgba(255, 215, 61, 0.5);
    border-radius: 50px;
    background: rgba(255, 215, 61, 0.1);
    animation: breath 2s infinite;
    font-weight: 600;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes breath {
    0%, 100% { box-shadow: 0 0 10px rgba(255, 215, 61, 0.3); }
    50% { box-shadow: 0 0 30px rgba(255, 215, 61, 0.8); }
  }
  .start-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Scéna */
  .scene {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Dort container */
  .cake-container {
    position: absolute;
    bottom: -600px;
    left: 50%;
    transform: translateX(-50%);
    transition: bottom 2.5s cubic-bezier(0.34, 1.26, 0.64, 1);
  }
  .cake-container.show {
    bottom: 12vh;
  }

  /* Jemný stín pod dortem (elipsa, ne čtverec) */
  .cake-shadow {
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 20px;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.2) 50%, transparent 80%);
    border-radius: 50%;
    filter: blur(4px);
    z-index: 0;
  }

  /* Elegantní talíř */
  .plate {
    width: 270px;
    height: 14px;
    background: linear-gradient(180deg, #f5f5f5 0%, #d0d0d0 40%, #8a8a8a 100%);
    border-radius: 50%;
    margin: 0 auto;
    margin-top: -6px;
    position: relative;
    z-index: 1;
    box-shadow:
      inset 0 2px 3px rgba(255, 255, 255, 0.6),
      inset 0 -2px 3px rgba(0, 0, 0, 0.2);
  }

  /* Dort */
  .cake {
    width: 240px;
    position: relative;
    margin: 0 auto;
  }

  .layer {
    position: relative;
    margin: 0 auto;
    box-shadow:
      inset 0 -15px 25px rgba(0, 0, 0, 0.25),
      inset 0 8px 15px rgba(255, 255, 255, 0.15);
  }

  .layer-bottom {
    width: 220px;
    height: 95px;
    background: linear-gradient(180deg, #e94e9c 0%, #c9357f 40%, #9b1f5f 100%);
    border-radius: 8px 8px 10px 10px;
  }
  .layer-middle {
    width: 180px;
    height: 80px;
    background: linear-gradient(180deg, #ff8ac6 0%, #e94e9c 40%, #c9357f 100%);
    border-radius: 8px 8px 10px 10px;
    margin-top: -4px;
  }
  .layer-top {
    width: 140px;
    height: 70px;
    background: linear-gradient(180deg, #ffc1dd 0%, #ff8ac6 40%, #e94e9c 100%);
    border-radius: 8px 8px 10px 10px;
    margin-top: -4px;
  }

  /* Jahody na okraji vrstev */
  .strawberries {
    position: absolute;
    top: -10px;
    left: 0;
    width: 100%;
    height: 20px;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    padding: 0 10px;
    z-index: 2;
  }
  .strawberry {
    position: relative;
    width: 14px;
    height: 16px;
    background: radial-gradient(circle at 35% 30%, #ff6b6b 0%, #e63946 50%, #a4161a 100%);
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    box-shadow:
      inset -2px -2px 3px rgba(0, 0, 0, 0.3),
      inset 2px 2px 2px rgba(255, 255, 255, 0.4),
      0 2px 3px rgba(0, 0, 0, 0.3);
  }
  /* Semínka na jahodě */
  .strawberry::before {
    content: '';
    position: absolute;
    inset: 2px 2px 3px 2px;
    background:
      radial-gradient(circle at 25% 30%, #ffdd77 0 0.8px, transparent 1.2px),
      radial-gradient(circle at 70% 25%, #ffdd77 0 0.8px, transparent 1.2px),
      radial-gradient(circle at 40% 55%, #ffdd77 0 0.8px, transparent 1.2px),
      radial-gradient(circle at 75% 60%, #ffdd77 0 0.8px, transparent 1.2px),
      radial-gradient(circle at 30% 75%, #ffdd77 0 0.8px, transparent 1.2px);
  }
  /* Zelený list na jahodě */
  .strawberry::after {
    content: '';
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 6px;
    background:
      radial-gradient(circle at 20% 100%, #2d8f3f 0 2.5px, transparent 3px),
      radial-gradient(circle at 50% 100%, #40b14f 0 3px, transparent 3.5px),
      radial-gradient(circle at 80% 100%, #2d8f3f 0 2.5px, transparent 3px);
  }

  /* Posypka - malé barevné tečky */
  .sprinkles {
    position: absolute;
    inset: 15px 10px auto 10px;
    pointer-events: none;
  }
  .sprinkle {
    position: absolute;
    width: 3px;
    height: 8px;
    border-radius: 2px;
    transform-origin: center;
  }

  /* Svíčky - sedí NA vrchní vrstvě dortu */
  .candles-container {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    justify-items: center;
    z-index: 5;
  }

  .candle {
    position: relative;
    width: 7px;
    height: 32px;
    border-radius: 2px 2px 1px 1px;
    box-shadow:
      inset -1.5px 0 2px rgba(0, 0, 0, 0.3),
      inset 1.5px 0 2px rgba(255, 255, 255, 0.3),
      0 2px 3px rgba(0, 0, 0, 0.4);
  }

  /* Knot */
  .wick {
    position: absolute;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 1.5px;
    height: 4px;
    background: #222;
    border-radius: 1px;
  }

  /* Plamínek */
  .flame {
    position: absolute;
    top: -22px;
    left: 50%;
    width: 10px;
    height: 20px;
    transform: translateX(-50%) scale(0);
    opacity: 0;
    transform-origin: bottom center;
    transition: opacity 0.3s;
  }
  .flame.lit {
    opacity: 1;
    animation: flicker 0.15s infinite alternate ease-in-out;
  }

  .flame-outer {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center bottom, #ffcc33 0%, #ff8800 40%, #ff4400 70%, transparent 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    filter: blur(1px);
  }
  .flame-inner {
    position: absolute;
    inset: 3px 2px 4px 2px;
    background: radial-gradient(ellipse at center bottom, #fff 0%, #fff8dc 30%, #ffcc33 70%, transparent 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  }

  /* Záře okolo plamínku */
  .glow {
    position: absolute;
    top: -35px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 60px;
    background: radial-gradient(circle, rgba(255, 180, 50, 0.6) 0%, rgba(255, 100, 0, 0.2) 40%, transparent 70%);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
    animation: glowPulse 1.5s infinite ease-in-out;
  }
  .glow.on { opacity: 1; }

  @keyframes glowPulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
    50% { transform: translateX(-50%) scale(1.2); opacity: 0.9; }
  }

  @keyframes flicker {
    0% {
      transform: translateX(-50%) scale(1, 1) rotate(-2deg);
      filter: brightness(1.1);
    }
    50% {
      transform: translateX(-50%) scale(0.95, 1.1) rotate(1deg);
      filter: brightness(1.3);
    }
    100% {
      transform: translateX(-50%) scale(1.05, 0.95) rotate(2deg);
      filter: brightness(1);
    }
  }

  /* Globální světelný efekt při zapálení */
  .light-flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center 70%, rgba(255, 200, 100, 0.4) 0%, transparent 50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s;
    z-index: 2;
  }
  .light-flash.on { opacity: 1; }

  /* Hlavní text */
  .message {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%) translateY(-30px);
    width: 92%;
    max-width: 720px;
    text-align: center;
    opacity: 0;
    transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10;
    padding: 0 10px;
  }
  .message.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .message h1 {
    font-family: 'Open Sans', sans-serif;
    font-weight: 800;
    font-size: clamp(1.3rem, 5vw, 2.6rem);
    background: linear-gradient(45deg, #ff6ec4 0%, #ffd93d 25%, #ff6ec4 50%, #ffd93d 75%, #ff6ec4 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
    line-height: 1.3;
    margin-bottom: 12px;
    filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.8));
    letter-spacing: -0.01em;
  }
  .message .name {
    display: block;
    font-size: clamp(1.9rem, 7.5vw, 3.8rem);
    margin-bottom: 10px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .message .sub {
    font-family: 'Open Sans', sans-serif;
    font-size: clamp(0.9rem, 3vw, 1.3rem);
    color: #ffd93d;
    font-weight: 400;
    opacity: 0.95;
    letter-spacing: 0.02em;
  }

  @keyframes shine {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  /* Canvas pro konfety */
  #confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }

  /* Srdíčka plovoucí */
  .heart {
    position: absolute;
    font-size: 20px;
    pointer-events: none;
    animation: floatUp 4s linear infinite;
    opacity: 0;
    z-index: 5;
  }
  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg) scale(0.5);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-100vh) rotate(360deg) scale(1.2);
      opacity: 0;
    }
  }

  /* Restart tlačítko */
  .restart {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 20px;
    background: rgba(255, 110, 196, 0.3);
    border: 2px solid #ff6ec4;
    color: #fff;
    border-radius: 50px;
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 50;
    font-size: 14px;
    backdrop-filter: blur(10px);
  }
  .restart.show {
    opacity: 1;
  }
  .restart:hover {
    background: rgba(255, 110, 196, 0.6);
  }

  /* Mobilní úpravy */
  @media (max-width: 480px) {
    .cake { width: 200px; }
    .layer-bottom { width: 190px; height: 80px; }
    .layer-middle { width: 155px; height: 70px; }
    .layer-top { width: 120px; height: 60px; }
    .plate { width: 230px; height: 12px; }
    .cake-shadow { width: 190px; }
    .candles-container { width: 95px; top: -24px; }
    .candle { width: 6px; height: 28px; }
    .flame { width: 8px; height: 17px; top: -19px; }
    .strawberry { width: 11px; height: 13px; }
  }
</style>
</head>
<body>
  <div class="start-overlay" id="startOverlay">
    <h1>🎂 Překvapení pro Emmu 🎂</h1>
    <p>Klikni pro spuštění přání ✨</p>
  </div>

  <div class="stars" id="stars"></div>
  <div class="light-flash" id="lightFlash"></div>

  <div class="scene">
    <div class="message" id="message">
      <h1>
        <span class="name">Milá Emmičko, 🎉</span>
        přeji ti všechno nejlepší<br>k tvým 17. narozeninám!
      </h1>
      <p class="sub">✨ Ať je tvůj rok plný štěstí, lásky a snů ✨</p>
    </div>

    <div class="cake-container" id="cake">
      <div class="cake">
        <!-- Svíčky -->
        <div class="candles-container" id="candles"></div>

        <!-- Vrchní vrstva - jen svíčky -->
        <div class="layer layer-top">
          <div class="sprinkles" id="sprinklesTop"></div>
        </div>

        <!-- Střední vrstva - s jahodami -->
        <div class="layer layer-middle">
          <div class="strawberries">
            <span class="strawberry"></span><span class="strawberry"></span><span class="strawberry"></span>
            <span class="strawberry"></span><span class="strawberry"></span><span class="strawberry"></span>
          </div>
          <div class="sprinkles" id="sprinklesMid"></div>
        </div>

        <!-- Spodní vrstva - s jahodami -->
        <div class="layer layer-bottom">
          <div class="strawberries">
            <span class="strawberry"></span><span class="strawberry"></span><span class="strawberry"></span>
            <span class="strawberry"></span><span class="strawberry"></span><span class="strawberry"></span>
            <span class="strawberry"></span>
          </div>
          <div class="sprinkles" id="sprinklesBot"></div>
        </div>

        <!-- Talíř -->
        <div class="plate"></div>

        <!-- Jemný stín pod dortem -->
        <div class="cake-shadow"></div>
      </div>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>
  <button class="restart" id="restart">🔄 Přehrát znovu</button>

<script>
  // === HVĚZDY ===
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.width = s.style.height = (Math.random() * 2 + 1) + 'px';
    starsEl.appendChild(s);
  }

  // === POSYPKA (barevné tečky na dortu) ===
  const sprinkleColors = ['#ff4466', '#ffd93d', '#6ec4ff', '#c4ff6e', '#ff9f6e', '#9f6eff'];
  function addSprinkles(elId, count) {
    const el = document.getElementById(elId);
    for (let i = 0; i < count; i++) {
      const sp = document.createElement('div');
      sp.className = 'sprinkle';
      sp.style.background = sprinkleColors[Math.floor(Math.random() * sprinkleColors.length)];
      sp.style.left = (5 + Math.random() * 90) + '%';
      sp.style.top = (10 + Math.random() * 70) + '%';
      sp.style.transform = `rotate(${Math.random() * 360}deg)`;
      el.appendChild(sp);
    }
  }
  addSprinkles('sprinklesTop', 8);
  addSprinkles('sprinklesMid', 12);
  addSprinkles('sprinklesBot', 15);

  // === SVÍČKY ===
  const candlesEl = document.getElementById('candles');
  const CANDLE_COUNT = 7;
  const candleColors = ['#ff6ec4', '#ffd93d', '#6ec4ff', '#c4ff6e', '#ff9f6e', '#9f6eff'];

  for (let i = 0; i < CANDLE_COUNT; i++) {
    const c = document.createElement('div');
    c.className = 'candle';
    const color = candleColors[i % candleColors.length];
    c.style.background = `repeating-linear-gradient(45deg, ${color} 0px, ${color} 4px, #fff 4px, #fff 8px)`;

    c.innerHTML = `
      <div class="wick"></div>
      <div class="glow"></div>
      <div class="flame">
        <div class="flame-outer"></div>
        <div class="flame-inner"></div>
      </div>
    `;
    candlesEl.appendChild(c);
  }

  // === AUDIO ===
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  // Zvuk konfet (party popper)
  function playConfettiSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    // POP
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.2);

    // Šelest papírků
    const bufferSize = audioCtx.sampleRate * 1.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      const env = Math.exp(-i / (bufferSize * 0.3));
      data[i] = (Math.random() * 2 - 1) * env * 0.4;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 3000;
    filter.Q.value = 0.5;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0.3;
    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    noise.start(now);

    // Jiskry
    for (let i = 0; i < 8; i++) {
      const t = now + Math.random() * 0.8;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.value = 2000 + Math.random() * 3000;
      g.gain.setValueAtTime(0.1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t);
      o.stop(t + 0.1);
    }
  }

  // Happy Birthday melodie
  function playBirthdayMelody() {
    if (!audioCtx) return;
    const notes = [
      { freq: 392, time: 0 },
      { freq: 392, time: 0.3 },
      { freq: 440, time: 0.6 },
      { freq: 392, time: 1.2 },
      { freq: 523, time: 1.8 },
      { freq: 494, time: 2.4 },
    ];
    const startTime = audioCtx.currentTime + 0.5;
    notes.forEach(n => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = n.freq;
      const t = startTime + n.time;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.15, t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.5);
    });
  }

  // === KONFETY ===
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const confetti = [];
  const confettiColors = ['#ff6ec4', '#ffd93d', '#6ec4ff', '#c4ff6e', '#ff9f6e', '#9f6eff', '#ff4466', '#44ff99'];
  const shapes = ['rect', 'circle', 'triangle', 'ribbon'];

  function createConfetti(x, y, count = 150) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 15 + 5;
      confetti.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - Math.random() * 8,
        gravity: 0.2 + Math.random() * 0.15,
        size: Math.random() * 8 + 4,
        color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
        shape: shapes[Math.floor(Math.random() * shapes.length)],
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.3,
        life: 1,
        wobble: Math.random() * Math.PI * 2,
      });
    }
  }

  function updateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = confetti.length - 1; i >= 0; i--) {
      const p = confetti[i];
      p.vy += p.gravity;
      p.vx *= 0.99;
      p.x += p.vx + Math.sin(p.wobble) * 0.5;
      p.y += p.vy;
      p.wobble += 0.1;
      p.rotation += p.rotationSpeed;

      if (p.y > canvas.height + 50) {
        confetti.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 5;

      if (p.shape === 'rect') {
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === 'triangle') {
        ctx.beginPath();
        ctx.moveTo(0, -p.size / 2);
        ctx.lineTo(p.size / 2, p.size / 2);
        ctx.lineTo(-p.size / 2, p.size / 2);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(-p.size, -p.size / 6, p.size * 2, p.size / 3);
      }
      ctx.restore();
    }
    requestAnimationFrame(updateConfetti);
  }
  updateConfetti();

  // === SRDÍČKA ===
  function spawnHearts() {
    const hearts = ['❤️', '💖', '💕', '💝', '✨', '🌟'];
    setInterval(() => {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = Math.random() * 100 + '%';
      h.style.bottom = '-30px';
      h.style.animationDuration = (3 + Math.random() * 3) + 's';
      h.style.fontSize = (15 + Math.random() * 15) + 'px';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 7000);
    }, 400);
  }

  // === HLAVNÍ SEKVENCE ===
  function startShow() {
    initAudio();

    // 1. Dort vyjede nahoru
    setTimeout(() => {
      document.getElementById('cake').classList.add('show');
    }, 300);

    // 2. Zapalování svíček - TICHÉ, jen vizuálně
    const flames = document.querySelectorAll('.flame');
    const glows = document.querySelectorAll('.glow');
    const CAKE_UP_DURATION = 2800;

    flames.forEach((flame, i) => {
      setTimeout(() => {
        flame.classList.add('lit');
        glows[i].classList.add('on');
      }, CAKE_UP_DURATION + i * 100);
    });

    // 3. Jemná záře po celé scéně
    setTimeout(() => {
      document.getElementById('lightFlash').classList.add('on');
    }, CAKE_UP_DURATION + 500);

    // 4. Melodie Happy Birthday - až s konfetami
    const confettiTime = CAKE_UP_DURATION + CANDLE_COUNT * 100 + 500;

    setTimeout(() => {
      playBirthdayMelody();
      playConfettiSound();

      createConfetti(window.innerWidth * 0.5, window.innerHeight * 0.5, 200);
      setTimeout(() => createConfetti(window.innerWidth * 0.2, window.innerHeight * 0.3, 100), 150);
      setTimeout(() => createConfetti(window.innerWidth * 0.8, window.innerHeight * 0.3, 100), 300);
      setTimeout(() => createConfetti(window.innerWidth * 0.5, window.innerHeight * 0.2, 150), 450);

      document.getElementById('message').classList.add('show');
      spawnHearts();

      setTimeout(() => {
        playConfettiSound();
        createConfetti(window.innerWidth * 0.3, window.innerHeight * 0.5, 120);
        createConfetti(window.innerWidth * 0.7, window.innerHeight * 0.5, 120);
      }, 1500);

      setTimeout(() => {
        createConfetti(window.innerWidth * 0.5, window.innerHeight * 0.4, 180);
      }, 3000);

      setTimeout(() => {
        document.getElementById('restart').classList.add('show');
      }, 2000);
    }, confettiTime);

    setInterval(() => {
      if (document.getElementById('message').classList.contains('show')) {
        createConfetti(
          Math.random() * window.innerWidth,
          window.innerHeight * 0.3,
          30
        );
      }
    }, 2500);
  }

  // === START ===
  document.getElementById('startOverlay').addEventListener('click', () => {
    document.getElementById('startOverlay').classList.add('hidden');
    setTimeout(startShow, 500);
  });
  document.getElementById('startOverlay').addEventListener('touchstart', (e) => {
    e.preventDefault();
    document.getElementById('startOverlay').classList.add('hidden');
    setTimeout(startShow, 500);
  }, { passive: false });

  document.getElementById('restart').addEventListener('click', () => {
    location.reload();
  });
</script>
</body>
</html>
